# Keeps the app's YouTube numbers fresh. Needs a repository secret YOUTUBE_API_KEY and
# GitHub Pages set to deploy from GitHub Actions. See docs/DECISIONS.md, D5.
name: Refresh YouTube metadata
on:
  schedule:
    - cron: "17 4 * * 1" # weekly; the app rejects files older than 30 days
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_youtube_meta.py data/vids.txt
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
